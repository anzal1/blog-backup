name: Backup blog

# Re-exports the Hashnode publication and commits anything that changed.
#
# The weekly schedule is off. In September 2026 Hashnode put Cloudflare in
# front of the whole publication: the sitemap, the feed and the site itself
# answer 403 to any request without a browser, so the exporter cannot reach
# them from CI, and the API has been Pro-only since June. The run on 7 Sept
# was the last one that worked; every run after it failed on
#   failed to fetch https://anzal.hashnode.dev/sitemap.xml: HTTP Error 403
#
# There is nothing to fix here, and a weekly failure email for something
# unfixable only teaches you to stop reading them. The exporter still works
# the day access returns or the publication moves, so this stays runnable by
# hand from the Actions tab.
#
# Nothing is at risk meanwhile: the archive already holds every post, and the
# portfolio repo's content/posts is now the working copy the site builds from.
# New posts get there through the browser clipper in that repo
# (scripts/hashnode-clip.js), which is not blocked because it reads the page
# you already have open.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export posts and mirror images
        run: python3 scripts/export_hashnode.py --host anzal.hashnode.dev --assets

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Backup: $(date -u +%Y-%m-%d)"
          git push
