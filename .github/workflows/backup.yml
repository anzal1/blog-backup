name: Backup blog

# Re-exports the Hashnode publication and commits anything that changed.
# Runs weekly, and on demand from the Actions tab.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export posts and mirror images
        run: python3 scripts/export_hashnode.py --host anzal.hashnode.dev --assets

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Backup: $(date -u +%Y-%m-%d)"
          git push
